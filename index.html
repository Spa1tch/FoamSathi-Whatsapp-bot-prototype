<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foam Saathi - Sleepfresh Bot Prototype</title>
<style>
:root{--green:#075e54;--green2:#128c7e;--lime:#25d366;--chat:#efeae2;--user:#d9fdd3;--ink:#1f2937;--muted:#667781;--line:#d9dee2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e9f7f1,#f4f6f8);color:var(--ink)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(430px,100%);height:min(860px,94vh);border:8px solid #263238;border-radius:32px;overflow:hidden;background:var(--chat);box-shadow:0 24px 70px #0003;display:flex;flex-direction:column}.head{background:var(--green);color:#fff;padding:13px;display:flex;align-items:center;gap:11px}.avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800}.headtext{flex:1}.headtext b{display:block}.headtext small{opacity:.82}.iconbtn{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer;padding:8px}.notice{font-size:11px;text-align:center;background:#fff2bd;color:#655716;padding:6px}.chat{flex:1;overflow-y:auto;padding:12px;background-color:var(--chat);background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:14px 14px}.msg{max-width:86%;padding:9px 11px;border-radius:9px;margin:7px 0;font-size:14px;line-height:1.42;box-shadow:0 1px 1px #0001;white-space:pre-wrap}.bot{background:#fff;border-top-left-radius:2px}.user{background:var(--user);margin-left:auto;border-top-right-radius:2px}.time{font-size:9px;color:#7b8790;float:right;margin:9px 0 0 9px}.choices{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px}.choices button{border:1px solid var(--lime);background:#fff;color:#087a46;border-radius:18px;padding:8px 11px;font-size:12px;font-weight:700;cursor:pointer}.choices button:hover{background:#edfff4}.menu{display:grid;gap:7px;margin:9px 0}.menu button{border:1px solid #d9e3df;background:#fff;border-radius:10px;padding:11px;text-align:left;color:#075e54;font-weight:700;cursor:pointer}.summary{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin:10px 0;font-size:12px}.summary h4{margin:0 0 8px}.sumrow{display:grid;grid-template-columns:110px 1fr;gap:7px;border-bottom:1px solid #eee;padding:4px 0}.sumrow:last-child{border:0}.sumrow span:first-child{color:var(--muted)}.faqbox{background:#fff;border-radius:10px;padding:10px;margin:8px 0}.faqbox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.faqresults{max-height:250px;overflow:auto;margin-top:7px}.faqitem{border-bottom:1px solid #eee;padding:8px 2px;cursor:pointer;font-size:13px}.faqitem:hover{color:var(--green)}.bar{background:#f0f2f5;padding:9px;display:flex;gap:7px}.bar input{flex:1;min-width:0;border:0;border-radius:22px;padding:11px 14px;outline:none}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--green2);color:white;cursor:pointer;font-size:17px}.send:disabled{background:#b8c5c3}.footnote{font-size:10px;text-align:center;color:#667781;padding:5px;background:#f0f2f5}
</style>
</head>
<body><div class="wrap"><div class="phone"><div class="head"><div class="avatar">FS</div><div class="headtext"><b>Foam Saathi</b><small>Sleepfresh Assistant • Prototype</small></div><button class="iconbtn" onclick="home()" title="Home">⌂</button><button class="iconbtn" onclick="restart()" title="Restart">↻</button></div><div class="notice">Prototype only. No purchase, price, pickup or payment is automatically confirmed.</div><div id="chat" class="chat"></div><div class="bar"><input id="input" placeholder="Choose an option above" disabled><button id="send" class="send" onclick="sendText()" disabled>➤</button></div><div class="footnote">No information leaves this browser in this demonstration.</div></div></div>
<script>
const FAQ = [{"q": "What is Sleepfresh?", "a": "Sleepfresh is a mattress and home-comfort brand from Raunak Coirs Limited. It offers mattresses made with materials such as coir, foam, memory foam, latex and pocket springs, along with selected accessories and furniture products."}, {"q": "Where is Sleepfresh based?", "a": "Sleepfresh is operated by Raunak Coirs Limited, based in Kolkata, West Bengal."}, {"q": "How can I contact Sleepfresh?", "a": "You can call +91 9433058682 or email info@sleepfresh.in for product, order or service-related assistance."}, {"q": "Does Sleepfresh sell directly online?", "a": "Yes. Eligible products can be purchased through the official Sleepfresh website, subject to availability and PIN-code serviceability."}, {"q": "What mattress types are available?", "a": "Sleepfresh offers coir, foam, memory foam, latex, rebonded foam, multi-layer and pocket-spring options. Availability varies by model."}, {"q": "How do I choose the right mattress?", "a": "Consider firmness, sleeping position, support preference, material, bed size and budget. Contact Sleepfresh for product guidance if required."}, {"q": "What comfort levels are available?", "a": "Options may include soft, medium-firm, firm and extra-firm, depending on the product."}, {"q": "Which mattress is suitable for back support?", "a": "Sleepfresh offers models positioned for orthopaedic or enhanced back support. Review the construction and firmness before purchase. Product guidance is not medical advice."}, {"q": "Is a firm mattress always better?", "a": "Not necessarily. Suitable firmness depends on comfort, sleeping position, body weight and support preference."}, {"q": "What is a reversible or dual-comfort mattress?", "a": "It is designed with usable surfaces that may offer different comfort levels. Check the model instructions before flipping or rotating."}, {"q": "Can I order a custom-size mattress?", "a": "Custom-size options may be available for selected products. Confirm dimensions carefully because separate cancellation, return and size-change conditions apply."}, {"q": "How do I measure my bed for a mattress?", "a": "Measure the inner length and width of the cot or bed frame where the mattress will sit."}, {"q": "Do mattress colours and patterns vary?", "a": "Minor differences in fabric colour, quilting or appearance may occur across models or production batches."}, {"q": "How can I place an order?", "a": "Select the product, size and available options, enter delivery details and complete payment through the offered checkout methods."}, {"q": "How can I check delivery availability?", "a": "Enter the delivery PIN code on the product or checkout page."}, {"q": "Can one order be delivered to multiple addresses?", "a": "No. Place separate orders for different delivery addresses."}, {"q": "Can I change mattress size after ordering?", "a": "It depends on the order stage, product type and applicable charges. Custom-size mattresses cannot be changed after confirmation."}, {"q": "Can I cancel my order?", "a": "Conditions differ for standard and custom sizes. Custom-size orders cannot be cancelled after six hours of order placement. Charges may apply to standard-size orders."}, {"q": "Are EMI options available?", "a": "No-cost EMI or other payment options may be offered on eligible purchases and will be shown during checkout."}, {"q": "How long does delivery take?", "a": "The stated range is generally two to fifteen working days from confirmed order and payment, depending on product, location and availability."}, {"q": "On which days are orders shipped?", "a": "Monday to Saturday, excluding public holidays."}, {"q": "How can I track my order?", "a": "The tracking number is shared with the invoice after the shipping partner collects the order."}, {"q": "What if the package is damaged or tampered with?", "a": "Refuse delivery and contact customer care with the order reference number and photographs of the product and packaging."}, {"q": "Will all items arrive together?", "a": "Sleepfresh aims to ship items together, but separate shipments may be required."}, {"q": "Can I return a mattress?", "a": "Eligibility depends on the product and policy. The online-only Dreamfresh range has a stated no-questions-asked return provision for an unused product, with logistics cost deducted. Confirm eligibility first."}, {"q": "How do I request a return?", "a": "Call +91 9433058682 or email info@sleepfresh.in. Eligible requests are normally validated within 24 to 48 hours."}, {"q": "When will I receive my refund?", "a": "Refund is processed after eligible pickup. Banks generally take seven to ten days to credit it after processing."}, {"q": "Are there size-change charges after delivery?", "a": "Charges may apply to standard-size mattresses and vary by height. Custom-size mattresses cannot be resized."}, {"q": "How long is the mattress warranty?", "a": "Warranty duration varies by model. Check the product page, invoice and warranty document."}, {"q": "What does the warranty cover?", "a": "Eligible manufacturing defects, primarily in the mattress core, subject to policy. Mishandling, accidents and improper use are excluded."}, {"q": "Is the full warranty a free replacement?", "a": "Not necessarily. An initial no-charge period may apply, while the remaining period may be pro-rata."}, {"q": "What documents are needed for a warranty claim?", "a": "Keep the original invoice and the warranty card stamped and signed by the authorised seller."}, {"q": "How do I register the warranty?", "a": "Use the Warranty Registration page and enter the purchase, customer, retailer, invoice, serial-number, product and size details."}, {"q": "How should I care for my mattress?", "a": "Use a firm, even and correctly sized cot. Keep the mattress dry, do not bend or fold it, and protect it from fire, spills and concentrated edge pressure."}, {"q": "Should I rotate my mattress?", "a": "The warranty guidance recommends head-to-foot rotation at least once a month. Follow model-specific instructions."}, {"q": "Can I carry the mattress using side handles?", "a": "No. The handles are for positioning, not carrying the full mattress weight."}, {"q": "Are body impressions a defect?", "a": "Some impressions are normal with use. A warranty assessment is needed to determine whether an issue is a manufacturing defect."}, {"q": "What can invalidate the warranty?", "a": "Accidents, mishandling, improper use, liquid exposure, stains, unsanitary condition, bending, folding, fire exposure or unsuitable cot support may invalidate it."}, {"q": "Is warranty service provided at home?", "a": "The published warranty is carry-in. The customer takes the product to the authorised channel partner and collects the approved replacement."}, {"q": "What information should I keep after purchase?", "a": "Keep the invoice, order number, product name, size, serial number, dealer details and warranty card."}, {"q": "Can Sleepfresh help me choose a mattress?", "a": "Yes. Contact Sleepfresh for general product guidance based on the information you provide and your comfort preference."}, {"q": "What if my question is not listed?", "a": "Call +91 9433058682 or email info@sleepfresh.in for assistance."}];
const $=id=>document.getElementById(id), chat=$('chat'), input=$('input'), send=$('send');
let mode='home', step=0, data={}, closed=false;
const scrapFlow=[
 {k:'consent',q:'Before we begin, do you agree to share basic business and scrap details for company review and follow-up?',o:['Yes, continue','No, exit']},
 {k:'name',q:'Please enter your name.',type:'text',ph:'Your name'},
 {k:'business',q:'Please enter your business name.',type:'text',ph:'Business name'},
 {k:'businessType',q:'What best describes your business?',o:['Foam dealer','Mattress maker','Sofa maker','Furniture shop','Cushion maker','Scrap dealer','Other']},
 {k:'phone',q:'Please enter a 10-digit mobile number for follow-up.',type:'tel',ph:'10-digit mobile number'},
 {k:'location',q:'Please enter your location: area and city.',type:'text',ph:'Example: Topsia, Kolkata'},
 {k:'scrapType',q:'What type of PU foam scrap do you have?',o:['Mattress foam','Sofa foam','Cushion foam','Manufacturing waste','Mixed foam','Other','Not sure']},
 {k:'quantity',q:'How much foam scrap do you have right now?',o:['Less than 50 kg','50–100 kg','100–500 kg','500–1,000 kg','More than 1,000 kg','Not sure']},
 {k:'frequency',q:'How often is foam scrap generated?',o:['Daily','Weekly','Monthly','Occasionally','One-time stock','Not sure']},
 {k:'disposal',q:'What do you currently do with the foam scrap?',o:['Sell to scrap dealer','Sell to foam/recycling company','Store it','Throw it away','Other']},
 {k:'interest',q:'Would you be interested in selling your foam scrap to Sleepfresh, subject to review and commercial agreement?',o:['Yes','Maybe','No']},
 {k:'price',q:'If you sell the scrap, approximately what price do you get per kg?',o:['Below ₹10/kg','₹10–20/kg','₹20–30/kg','₹30–40/kg','Above ₹40/kg','Not sure']},
 {k:'quality',q:'How would you describe the quality of the foam scrap?',o:['Clean','Mostly clean','Dirty','Mixed with cloth/plastic','Not sure']},
 {k:'dry',q:'Is the foam dry and free from water?',o:['Yes','No','Not sure']},
 {k:'size',q:'What is the usual size of the foam pieces?',o:['Small','Medium','Large','Mixed sizes','Not sure']},
 {k:'photos',q:'Please share 2–3 current photos after the basic details. For this prototype, select the current status.',o:['Photos ready','Will share later','Unable to share']},
 {k:'handover',q:'How would you prefer to hand over the foam scrap?',o:['Company pickup','I can deliver it','Depends on quantity']},
 {k:'pickup',q:'What pickup time would be convenient?',o:['Morning','Afternoon','Evening','To be discussed']},
 {k:'payment',q:'How would you prefer to receive payment?',o:['UPI','Bank transfer','Cash','Other','To be discussed']},
 {k:'notes',q:'Is there anything else the company should know? Type a short note or type Skip.',type:'text',ph:'Short note or Skip'},
 {k:'confirm',q:'Please review the details below. Would you like to submit the request for company review?',o:['Submit request','Start again']}
];
function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function msg(text,who='bot'){let d=document.createElement('div');d.className='msg '+who;d.innerHTML=text+'<span class="time">'+now()+'</span>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function clearControls(){document.querySelectorAll('.choices,.menu,.faqbox,.summary').forEach(x=>x.remove());input.value='';input.disabled=true;send.disabled=true;input.placeholder='Choose an option above'}
function buttons(items,handler=answer){let box=document.createElement('div');box.className='choices';items.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{box.remove();handler(v)};box.appendChild(b)});chat.appendChild(box);chat.scrollTop=chat.scrollHeight}
function mainMenu(){mode='home';closed=false;clearControls();msg('How can I help you today?');let m=document.createElement('div');m.className='menu';[['♻ Sell foam scrap','scrap'],['🛏 Ask about Sleepfresh products and services','faq'],['📞 Contact Sleepfresh','contact'],['ℹ How this scrap process works','process']].forEach(([label,key])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.remove();selectMenu(key)};m.appendChild(b)});chat.appendChild(m);chat.scrollTop=chat.scrollHeight}
function home(){clearControls();msg('Home','user');mainMenu()}
function restart(){chat.innerHTML='';data={};step=0;closed=false;msg('Namaste! Welcome to Foam Saathi, the Sleepfresh assistant.');mainMenu()}
function selectMenu(key){msg(key==='scrap'?'Sell foam scrap':key==='faq'?'Ask a question':key==='contact'?'Contact Sleepfresh':'How it works','user');if(key==='scrap'){mode='scrap';data={createdAt:new Date().toISOString(),source:'Foam Saathi HTML prototype'};step=0;askScrap()}else if(key==='faq'){mode='faq';showFaq()}else if(key==='contact'){msg('You can contact Sleepfresh customer care at <b>+91 9433058682</b> or email <b>info@sleepfresh.in</b>.');buttons(['Back to main menu'],mainMenu)}else{msg('1. Share your business and scrap details.<br>2. Select the foam type, quantity and condition.<br>3. Share 2–3 current photos.<br>4. Submit the request for company review.<br>5. An authorised representative may contact you.<br><br>Submission does not guarantee purchase, pickup, price or payment.');buttons(['Start scrap request','Back to main menu'],v=>v==='Start scrap request'?selectMenu('scrap'):mainMenu())}}
function askScrap(){let f=scrapFlow[step];if(!f)return;msg(f.q);if(f.k==='confirm')showSummary();if(f.o)buttons(f.o);else{input.disabled=false;send.disabled=false;input.placeholder=f.ph||'Type your reply';input.focus()}}
function answer(v){if(mode!=='scrap'||closed)return;let f=scrapFlow[step];msg(v,'user');if(f.k==='consent'&&v==='No, exit'){data.consent=false;closed=true;msg('No problem. No request has been submitted.');buttons(['Back to main menu'],mainMenu);return}if(f.k==='confirm'&&v==='Start again'){data={};step=0;msg('Starting again.');askScrap();return}data[f.k]=v;if(f.k==='confirm'){let ref='FS-'+Math.floor(100000+Math.random()*900000);data.reference=ref;data.status='Submitted for company review';closed=true;msg('Thank you. Your request has been submitted with reference <b>'+ref+'</b>.<br><br>Final material acceptance, price, pickup and payment will be confirmed separately by an authorised Sleepfresh representative.');buttons(['Download request','Back to main menu'],x=>x==='Download request'?downloadRequest():mainMenu());return}step++;askScrap()}
function sendText(){if(mode!=='scrap'||input.disabled)return;let v=input.value.trim();if(!v)return;let f=scrapFlow[step];if(f.k==='phone'&&!/^\d{10}$/.test(v.replace(/\s/g,''))){msg('Please enter a valid 10-digit mobile number.');return}input.value='';input.disabled=true;send.disabled=true;answer(v)}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendText()});
function showSummary(){let labels={name:'Name',business:'Business',businessType:'Business type',phone:'Mobile',location:'Location',scrapType:'Scrap type',quantity:'Quantity',frequency:'Generation frequency',disposal:'Current disposal',interest:'Interest',price:'Current price',quality:'Quality',dry:'Dryness',size:'Piece size',photos:'Photos',handover:'Handover',pickup:'Pickup time',payment:'Payment',notes:'Notes'};let box=document.createElement('div');box.className='summary';box.innerHTML='<h4>Request summary</h4>'+Object.entries(labels).filter(([k])=>data[k]).map(([k,l])=>'<div class="sumrow"><span>'+l+'</span><b>'+escapeHtml(data[k])+'</b></div>').join('');chat.appendChild(box)}
function showFaq(){clearControls();msg('Type a keyword or choose a common question.');let box=document.createElement('div');box.className='faqbox';box.innerHTML='<input id="faqSearch" placeholder="Search mattress, delivery, warranty, return..."><div id="faqResults" class="faqresults"></div>';chat.appendChild(box);let s=document.getElementById('faqSearch'),r=document.getElementById('faqResults');function render(){let q=s.value.toLowerCase().trim();let list=FAQ.filter(x=>!q||x.q.toLowerCase().includes(q)||x.a.toLowerCase().includes(q)).slice(0,10);r.innerHTML=list.map((x,i)=>'<div class="faqitem" data-i="'+FAQ.indexOf(x)+'">'+escapeHtml(x.q)+'</div>').join('');r.querySelectorAll('.faqitem').forEach(el=>el.onclick=()=>faqAnswer(Number(el.dataset.i)))}s.oninput=render;render();s.focus()}
function faqAnswer(i){let x=FAQ[i];document.querySelector('.faqbox')?.remove();msg(x.q,'user');msg(x.a);buttons(['Ask another question','Back to main menu'],v=>v==='Ask another question'?showFaq():mainMenu())}
function downloadRequest(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=(data.reference||'foam-saathi-request')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function escapeHtml(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
restart();
</script></body></html>
